// Verification helpers for the ci-verify workflow. Applied via --init-script so none of
// this has to live in the repository.
//
//   reportConfiguration -Pconf=<name>   prints "ARTIFACT<TAB>size<TAB>filename" per
//                                       resolved artifact, plus a TOTAL line
//   stageConfiguration  -Pconf=<name>   copies every resolved artifact into
//                                       build/ci-verify/<name>/
import java.nio.file.Files
import java.nio.file.StandardCopyOption

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':rundeckapp')
    if (app == null) {
        return
    }

    def confName = {
        app.hasProperty('conf') ? app.property('conf').toString() : 'runtimeClasspath'
    }

    app.tasks.register('reportConfiguration') {
        // Depend on the configuration so project-produced jars are actually built;
        // otherwise File.length() silently reports 0 for them.
        dependsOn { app.configurations.getByName(confName()) }
        doLast {
            def name = confName()
            def files = app.configurations.getByName(name).files.sort { it.name }
            long total = 0
            files.each { f ->
                total += f.length()
                println "ARTIFACT\t${f.length()}\t${f.name}"
            }
            println "TOTAL\t${name}\t${files.size()}\t${total}"
        }
    }

    app.tasks.register('stageConfiguration') {
        dependsOn { app.configurations.getByName(confName()) }
        doLast {
            def name = confName()
            def out = new File(app.buildDir, "ci-verify/${name}")
            out.mkdirs()
            app.configurations.getByName(name).files.each { f ->
                Files.copy(f.toPath(), new File(out, f.name).toPath(),
                        StandardCopyOption.REPLACE_EXISTING)
            }
            println "STAGED\t${name}\t${out.absolutePath}"
        }
    }
}
