# Throwaway verification workflow for the compiled-asset de-duplication.
# Lives only on ci-verify/** branches in a fork so the PR branch stays clean.
#
# assetCompile cannot run here: vendorAssetDeps and copySpa resolve npm packages from
# npm.artifacts.pd-internal.com, which answers 401 without CLOUDSMITH_NPM_TOKEN. Both jobs
# below therefore keep the NpmTask chain out of the way and substitute a marker file for
# the compiled assets.
name: verify-asset-dedup

on:
  push:
    branches:
      - 'ci-verify/**'
  workflow_dispatch:

env:
  BASE_SHA: f2f142bc66d99d13a33a5e114dad8e11f4ca3e8e
  SKIP_NPM: >-
    -x copySpa -x vendorAssetDeps -x assetCompile -x assetPluginPackage

jobs:
  # Does copyCompiledAssets still sit in the WAR's task graph, and does it still sit in
  # bootRun's? --dry-run resolves the graph without executing anything, so no npm.
  taskgraph:
    if: github.event_name == 'workflow_dispatch'
    name: task graph diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dry run both task graphs, fixed
        run: |
          for t in bootWar bootRun processResources; do
            ./gradlew ":rundeckapp:$t" --dry-run --console=plain --no-daemon \
              | grep -E '^:' | sort > "graph-$t-fixed.txt"
            echo "$t fixed: $(wc -l < graph-$t-fixed.txt) tasks"
          done
      - name: Dry run both task graphs, base
        run: |
          git checkout "$BASE_SHA" -- rundeckapp/build.gradle
          for t in bootWar bootRun processResources; do
            ./gradlew ":rundeckapp:$t" --dry-run --console=plain --no-daemon \
              | grep -E '^:' | sort > "graph-$t-base.txt"
            echo "$t base: $(wc -l < graph-$t-base.txt) tasks"
          done
          git checkout HEAD -- rundeckapp/build.gradle
      - name: Report
        run: |
          for t in bootWar bootRun processResources; do
            echo "===== :rundeckapp:$t"
            diff "graph-$t-base.txt" "graph-$t-fixed.txt" && echo "  (identical)"
            echo "  copyCompiledAssets  base=$(grep -c copyCompiledAssets graph-$t-base.txt || true) fixed=$(grep -c copyCompiledAssets graph-$t-fixed.txt || true)"
            echo
          done
      - name: Assert
        run: |
          fail=0
          grep -q copyCompiledAssets graph-bootWar-base.txt \
            || { echo "::error::base bootWar graph should contain copyCompiledAssets"; fail=1; }
          grep -q copyCompiledAssets graph-bootWar-fixed.txt \
            && { echo "::error::fixed bootWar graph still contains copyCompiledAssets"; fail=1; }
          grep -q copyCompiledAssets graph-bootRun-fixed.txt \
            || { echo "::error::fixed bootRun graph lost copyCompiledAssets"; fail=1; }
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taskgraph
          path: graph-*.txt
          if-no-files-found: warn

  # Build a WAR with a marker file standing in for the compiled assets and look at where
  # it lands. Best effort: bootWar may fail here for reasons unrelated to this change.
  war-structure:
    if: github.event_name == 'workflow_dispatch'
    name: WAR structure with a marker asset
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build WAR, base
        id: base
        continue-on-error: true
        run: |
          git checkout "$BASE_SHA" -- rundeckapp/build.gradle
          mkdir -p rundeckapp/build/assets
          echo "// ci marker" > rundeckapp/build/assets/ci-marker.js
          ./gradlew :rundeckapp:bootWar $SKIP_NPM --console=plain --no-daemon
          w=$(ls rundeckapp/build/libs/rundeck-*.war | head -1)
          echo "war=$w  $(stat -c%s "$w") bytes"
          unzip -Z1 "$w" | grep -E '(^|/)assets/' | sed 's!/[^/]*$!/!' | sort -u > layout-base.txt
          unzip -Z1 "$w" | grep ci-marker > marker-base.txt || true
          cp "$w" /tmp/base.war
          git checkout HEAD -- rundeckapp/build.gradle
      - name: Build WAR, fixed
        id: fixed
        continue-on-error: true
        run: |
          ./gradlew :rundeckapp:clean --console=plain --no-daemon
          mkdir -p rundeckapp/build/assets
          echo "// ci marker" > rundeckapp/build/assets/ci-marker.js
          ./gradlew :rundeckapp:bootWar $SKIP_NPM --console=plain --no-daemon
          w=$(ls rundeckapp/build/libs/rundeck-*.war | head -1)
          echo "war=$w  $(stat -c%s "$w") bytes"
          unzip -Z1 "$w" | grep -E '(^|/)assets/' | sed 's!/[^/]*$!/!' | sort -u > layout-fixed.txt
          unzip -Z1 "$w" | grep ci-marker > marker-fixed.txt || true
      - name: Report
        if: always()
        run: |
          for f in layout-base.txt layout-fixed.txt marker-base.txt marker-fixed.txt; do
            echo "===== $f"
            [ -f "$f" ] && cat "$f" || echo "  (not produced)"
            echo
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: war-structure
          path: |
            layout-*.txt
            marker-*.txt
          if-no-files-found: warn

  # Boot the WAR and fetch the marker over HTTP. This is the part that actually proves the
  # WAR-root copy is the one being served, which is why the classpath copy can go.
  serve:
    if: github.event_name == 'workflow_dispatch'
    name: boot the WAR and GET /assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [base, fixed]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select variant
        run: |
          if [ "${{ matrix.variant }}" = base ]; then
            git checkout "$BASE_SHA" -- rundeckapp/build.gradle
          fi
          git --no-pager diff --stat HEAD -- rundeckapp/build.gradle || true
      - name: Stage marker assets and build the WAR
        run: |
          mkdir -p rundeckapp/build/assets
          printf '// ci marker asset\n' > rundeckapp/build/assets/ci-marker.js
          printf 'ci-marker.js=ci-marker.js\n' > rundeckapp/build/assets/manifest.properties
          ./gradlew :rundeckapp:bootWar $SKIP_NPM --console=plain --no-daemon
          w=$(ls rundeckapp/build/libs/rundeck-*.war | head -1)
          cp "$w" /tmp/rundeck.war
          echo "== where the marker landed =="
          unzip -Z1 /tmp/rundeck.war | grep -E 'ci-marker|assets/manifest.properties' | sort
      - name: Install and start
        run: |
          mkdir -p "$HOME/rdbase"
          java -jar /tmp/rundeck.war --installonly --basedir "$HOME/rdbase"
          cd "$HOME/rdbase"
          nohup java -Xmx2g -Drdeck.base="$HOME/rdbase" \
            -Dserver.http.port=4440 \
            -jar /tmp/rundeck.war > "$HOME/rundeck.log" 2>&1 &
          echo $! > "$HOME/rundeck.pid"
      - name: Wait for the port
        run: |
          for i in $(seq 1 120); do
            if curl -s -o /dev/null -m 5 http://localhost:4440/ ; then
              echo "up after ${i}0s"; exit 0
            fi
            if ! kill -0 "$(cat "$HOME/rundeck.pid")" 2>/dev/null; then
              echo "::error::process died"; tail -100 "$HOME/rundeck.log"; exit 1
            fi
            sleep 10
          done
          echo "::error::timed out"; tail -200 "$HOME/rundeck.log"; exit 1
      - name: GET /assets/ci-marker.js
        run: |
          code=$(curl -s -o body.txt -w '%{http_code}' -m 20 http://localhost:4440/assets/ci-marker.js)
          echo "HTTP $code"
          cat body.txt
          if [ "$code" != 200 ]; then
            echo "::error::the WAR-root asset was not served (HTTP $code)"
            grep -iE "asset" "$HOME/rundeck.log" | tail -40 || true
            exit 1
          fi
          grep -q "ci marker asset" body.txt || { echo "::error::wrong body"; exit 1; }
          echo "OK: served from the WAR root"
      - name: Server log tail
        if: always()
        run: tail -120 "$HOME/rundeck.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serve-${{ matrix.variant }}
          path: |
            body.txt
            ~/rundeck.log
          if-no-files-found: warn

  # Does a stale build/resources/main/assets from an earlier revision survive an
  # incremental build and end up back in the WAR? Gradle has stale-output cleanup for
  # registered output directories, so this may already be handled. Diagnostic only.
  stale-output:
    name: stale resources/main/assets across an incremental build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build with the parent's build.gradle
        run: |
          git checkout "$BASE_SHA" -- rundeckapp/build.gradle
          mkdir -p rundeckapp/build/assets
          printf '// ci marker asset\n' > rundeckapp/build/assets/ci-marker.js
          printf 'ci-marker.js=ci-marker.js\n' > rundeckapp/build/assets/manifest.properties
          ./gradlew :rundeckapp:bootWar $SKIP_NPM --console=plain --no-daemon
          echo "== build/resources/main/assets after the base build =="
          ls -la rundeckapp/build/resources/main/assets/ 2>/dev/null || echo "  (absent)"
          echo "== marker locations in the base WAR =="
          unzip -Z1 rundeckapp/build/libs/rundeck-*.war | grep ci-marker | sort
      - name: Rebuild with this branch's build.gradle, no clean
        run: |
          git checkout HEAD -- rundeckapp/build.gradle
          ./gradlew :rundeckapp:bootWar $SKIP_NPM --console=plain --no-daemon
          echo "== build/resources/main/assets after the incremental build =="
          ls -la rundeckapp/build/resources/main/assets/ > staged-after.txt 2>&1 || echo "(absent)" > staged-after.txt
          cat staged-after.txt
          echo "== marker locations in the incremental WAR =="
          unzip -Z1 rundeckapp/build/libs/rundeck-*.war | grep ci-marker | sort | tee marker-incremental.txt
      - name: Verdict
        run: |
          if grep -q 'WEB-INF/classes/assets/ci-marker.js' marker-incremental.txt; then
            echo "VERDICT: STALE - the duplicate survived the incremental build, a Delete task is needed"
          else
            echo "VERDICT: CLEAN - Gradle removed the stale output on its own"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stale-output
          path: |
            marker-incremental.txt
            staged-after.txt
          if-no-files-found: warn
