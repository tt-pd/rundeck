# Throwaway verification workflow. Lives only on ci-verify/** branches in a fork so the
# PR branch stays clean.
#
# The WAR's WEB-INF/lib is exactly the resolved :rundeckapp:runtimeClasspath, so resolving
# that configuration is sufficient to prove the build-time toolchain is gone. This needs
# only a JDK: no Node and no CLOUDSMITH_NPM_TOKEN, because verifyNodeVersion is wired to
# NpmTask only and neither `dependencies` nor the reporter triggers an NpmTask.
#
# Assertions run against the resolved artifact list (ARTIFACT lines emitted by
# .github/ci-verify-report.gradle), never against `gradle dependencies` output: the tree
# also prints platform/BOM entries and "(c)" constraints, which are not artifacts.
name: verify-runtime-classpath

on:
  push:
    branches:
      - 'ci-verify/**'
  workflow_dispatch:

env:
  # Matched against resolved jar file names.
  FORBIDDEN: '^(gradle-tooling-api|grails-shell-cli|grails-gradle-common|grails-gradle-model|groovy-ant|groovy-groovydoc|groovy-docgenerator|qdox|groovy-test|maven-|org\.eclipse\.sisu|plexus-|ant-antlr)-'
  # Commit this branch is based on, used to produce the before/after comparison.
  BASE_SHA: f2f142bc66d99d13a33a5e114dad8e11f4ca3e8e

jobs:
  baseline:
    name: base commit (expect present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Revert build.gradle to the base commit
        run: |
          git checkout "$BASE_SHA" -- rundeckapp/build.gradle
          git --no-pager diff --stat HEAD -- rundeckapp/build.gradle
      - name: Report resolved runtimeClasspath
        run: |
          ./gradlew --init-script .github/ci-verify-report.gradle \
            :rundeckapp:reportRuntimeClasspath -q --console=plain --no-daemon \
            | tee report-base.txt
      - name: Summarise
        run: |
          grep '^ARTIFACT' report-base.txt | cut -f3 | sort > jars-base.txt
          grep '^TOTAL' report-base.txt
          echo
          echo "build-time only artifacts present on the base commit:"
          grep '^ARTIFACT' report-base.txt \
            | awk -F'\t' -v re="$FORBIDDEN" '$3 ~ re {printf "%10d  %s\n", $2, $3; c+=$2; n++}
                 END {printf "\n%d jars  %d bytes  %.2f MiB\n", n, c, c/1048576}'
      - uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: |
            report-base.txt
            jars-base.txt
          if-no-files-found: warn

  fixed:
    name: with exclusions (expect absent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Report resolved runtimeClasspath
        run: |
          ./gradlew --init-script .github/ci-verify-report.gradle \
            :rundeckapp:reportRuntimeClasspath -q --console=plain --no-daemon \
            | tee report-fixed.txt
          grep '^ARTIFACT' report-fixed.txt | cut -f3 | sort > jars-fixed.txt
          grep '^TOTAL' report-fixed.txt
      - name: Dependency tree (for review)
        continue-on-error: true
        run: |
          ./gradlew :rundeckapp:dependencies --configuration runtimeClasspath \
            --console=plain --no-daemon > deps-fixed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed
          path: |
            report-fixed.txt
            jars-fixed.txt
            deps-fixed.txt
          if-no-files-found: warn
      - name: Assert forbidden artifacts are gone
        run: |
          if grep -E "$FORBIDDEN" jars-fixed.txt; then
            echo "::error::build-time only artifacts are still on :rundeckapp:runtimeClasspath"
            exit 1
          fi
          echo "OK: no build-time only artifacts on the runtime classpath"
