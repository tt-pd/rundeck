# Throwaway verification workflow. Lives only on ci-verify/** branches in a fork so the
# PR branch stays clean. Not intended for upstream.
#
# A full `bootWar` is impossible on a public runner: rundeckapp/grails-spa and
# grails-app/assets/javascripts/_package-manager resolve npm packages from
# npm.artifacts.pd-internal.com, which answers 401 without CLOUDSMITH_NPM_TOKEN. Every
# job below therefore avoids the NpmTask chain.
name: verify-runtime-classpath

on:
  push:
    branches:
      - 'ci-verify/**'
  workflow_dispatch:

env:
  # Matched against resolved jar file names.
  FORBIDDEN: '^(gradle-tooling-api|grails-shell-cli|grails-gradle-common|grails-gradle-model|groovy-ant|groovy-groovydoc|groovy-docgenerator|qdox|groovy-test|maven-|org\.eclipse\.sisu|plexus-|ant-antlr)-'
  BASE_SHA: f2f142bc66d99d13a33a5e114dad8e11f4ca3e8e
  # Tasks that would reach the private npm registry.
  SKIP_NPM: >-
    -x copySpa -x vendorAssetDeps -x assetCompile -x assetPluginPackage
    -x copyAssetManifest

jobs:
  # Resolve runtimeClasspath and testRuntimeClasspath on both commits and diff them.
  # testRuntimeClasspath extends testImplementation/testRuntimeOnly, not runtimeClasspath,
  # so it must come out identical; that is what makes the test result meaningful.
  classpaths:
    name: classpath diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Report both configurations, fixed
        run: |
          for c in runtimeClasspath testRuntimeClasspath; do
            ./gradlew --init-script .github/ci-verify-report.gradle \
              :rundeckapp:reportConfiguration -Pconf=$c -q --console=plain --no-daemon \
              > "$c-fixed.txt"
            grep '^ARTIFACT' "$c-fixed.txt" | cut -f3 | sort > "jars-$c-fixed.txt"
            grep '^TOTAL' "$c-fixed.txt"
          done
      - name: Report both configurations, base
        run: |
          git checkout "$BASE_SHA" -- rundeckapp/build.gradle
          for c in runtimeClasspath testRuntimeClasspath; do
            ./gradlew --init-script .github/ci-verify-report.gradle \
              :rundeckapp:reportConfiguration -Pconf=$c -q --console=plain --no-daemon \
              > "$c-base.txt"
            grep '^ARTIFACT' "$c-base.txt" | cut -f3 | sort > "jars-$c-base.txt"
            grep '^TOTAL' "$c-base.txt"
          done
          git checkout HEAD -- rundeckapp/build.gradle
      - name: runtimeClasspath must lose only the build-time toolchain
        run: |
          echo "== removed =="
          comm -23 jars-runtimeClasspath-base.txt jars-runtimeClasspath-fixed.txt \
            | tee removed.txt
          echo "== added (must be empty) =="
          comm -13 jars-runtimeClasspath-base.txt jars-runtimeClasspath-fixed.txt \
            | tee added.txt
          test ! -s added.txt
          # every removal must be an expected build-time artifact
          if grep -vE "$FORBIDDEN" removed.txt | grep -v '^javax.inject-'; then
            echo "::error::unexpected artifact removed from runtimeClasspath"
            exit 1
          fi
          grep '^ARTIFACT' runtimeClasspath-base.txt \
            | awk -F'\t' 'NR==FNR{r[$0]=1;next} ($3 in r){c+=$2;n++}
                 END{printf "removed %d jars, %d bytes, %.2f MiB\n", n, c, c/1048576}' \
                 removed.txt -
      - name: testRuntimeClasspath must be unchanged
        run: |
          if ! diff -u jars-testRuntimeClasspath-base.txt jars-testRuntimeClasspath-fixed.txt; then
            echo "::error::testRuntimeClasspath changed; unit tests are affected"
            exit 1
          fi
          echo "OK: testRuntimeClasspath is identical, unit tests cannot be affected"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classpaths
          path: |
            runtimeClasspath-*.txt
            testRuntimeClasspath-*.txt
            jars-*.txt
            removed.txt
            added.txt
          if-no-files-found: warn

  unit-tests:
    name: rundeckapp unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: :rundeckapp:test
        run: |
          ./gradlew :rundeckapp:test $SKIP_NPM \
            --console=plain --no-daemon
      - name: Summarise results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          files=glob.glob('rundeckapp/build/test-results/test/*.xml')
          for p in files:
              try: r=ET.parse(p).getroot()
              except Exception: continue
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0))
              e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          print(f"result files={len(files)} tests={t} failures={f} errors={e} skipped={s}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            rundeckapp/build/test-results/test/**/*.xml
            rundeckapp/build/reports/tests/test/**
          if-no-files-found: warn

  # Informational: does anything left on runtimeClasspath statically reference classes
  # from the removed jars? Reference-only hits are not necessarily faults, because the JVM
  # resolves classes lazily, but they are what a reviewer should look at.
  static-refs:
    name: static references into removed jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Stage both classpaths
        run: |
          ./gradlew --init-script .github/ci-verify-report.gradle \
            :rundeckapp:stageConfiguration -Pconf=runtimeClasspath -q --console=plain --no-daemon
          mv rundeckapp/build/ci-verify/runtimeClasspath fixed-cp
          git checkout "$BASE_SHA" -- rundeckapp/build.gradle
          ./gradlew --init-script .github/ci-verify-report.gradle \
            :rundeckapp:stageConfiguration -Pconf=runtimeClasspath -q --console=plain --no-daemon
          mv rundeckapp/build/ci-verify/runtimeClasspath base-cp
          git checkout HEAD -- rundeckapp/build.gradle
          echo "base=$(ls base-cp | wc -l) fixed=$(ls fixed-cp | wc -l)"
      - name: Collect package prefixes owned by the removed jars
        run: |
          mkdir -p removed
          for j in base-cp/*.jar; do
            [ -f "fixed-cp/$(basename "$j")" ] || cp "$j" removed/
          done
          echo "removed jars: $(ls removed | wc -l)"
          for j in removed/*.jar; do
            unzip -Z1 "$j" '*.class' 2>/dev/null
          done | sed 's/\.class$//' \
               | awk -F/ 'NF>=3 {print $1"/"$2"/"$3"/"} NF==2 {print $1"/"$2"/"}' \
               | sort -u > prefixes.txt
          wc -l prefixes.txt
          cat prefixes.txt
      - name: Scan the surviving classpath for references
        run: |
          : > hits.txt
          for j in fixed-cp/*.jar; do
            if unzip -p "$j" '*.class' 2>/dev/null \
                 | LC_ALL=C strings -a \
                 | LC_ALL=C grep -F -f prefixes.txt -o 2>/dev/null \
                 | sort -u > /tmp/h; then
              if [ -s /tmp/h ]; then
                while read -r pfx; do
                  echo -e "$(basename "$j")\t$pfx" >> hits.txt
                done < /tmp/h
              fi
            fi
          done
          echo "== jars referencing removed packages =="
          if [ -s hits.txt ]; then
            cut -f1 hits.txt | sort -u
            echo
            echo "== detail =="
            sort -u hits.txt
          else
            echo "none"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-refs
          path: |
            prefixes.txt
            hits.txt
          if-no-files-found: warn
